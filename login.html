<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KalaSetu AI</title>
    <link rel="stylesheet" href="../style.css">

```
<style>
    .login-section {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: #fffaf3;
    }

    .login-card {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .login-card h1 {
        text-align: center;
        color: #75452c;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #72645a;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddcabb;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .login-submit {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 6px;
        background: #75452c;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .login-submit:hover {
        background: #59331f;
    }

    .message {
        margin-top: 15px;
        text-align: center;
    }

    .register-link {
        text-align: center;
        margin-top: 22px;
    }

    .register-link a {
        color: #a65f30;
        text-decoration: none;
        font-weight: bold;
    }
</style>
```

</head>

<body>

```
<header>
    <div class="logo">KalaSetu <span>AI</span></div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="products.html">Explore Products</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<section class="login-section">
    <div class="login-card">

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Login to your KalaSetu AI account.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-submit">
                Login
            </button>

            <p id="message" class="message"
               aria-live="polite"></p>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </div>

    </div>
</section>

<script>
    document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const message = document.getElementById("message");

            message.textContent =
                "Form validated. Backend authentication is pending.";

            message.style.color = "green";
        });
</script>
```

</body>
</html>
